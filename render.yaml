# Render Blueprint fuer den "Deploy to Render"-Knopf (Weg 1: Code sichtbar, Kunde betreibt selbst).
# Quelle: PROJEKTE/PLAN-VERKAUF-RENDER-BUNNY-KNOPF-2026-11-18.md Abschnitt 1.4-1.6 (Projektzentrale-Repo).
# Zwei Punkte, die der Plan als "noch zu klaeren" markiert hatte, sind jetzt anhand des echten Codes geklaert:
# - DB_DATEI/DATEI_ORDNER default in konfig.mjs auf RELATIVE Pfade ('daten/lern-app.db', 'daten/dateien') --
#   die muessen explizit auf den Festplatten-Mount zeigen, sonst verliert der Kunde seine Daten bei jedem Neustart.
# - F-321-FIX (19.11.2026, nach echtem Live-Test): BASE_URL ist HIER NICHT MEHR ALS FELD vorhanden. Der Kunde musste
#   die Adresse vorher raten; Render weist bei Namenskollision aber eine ANDERE Adresse zu, der Login scheiterte dann
#   mit 403 (P14-Origin-Pruefung), ohne erkennbaren Grund fuer den Kunden. konfig.mjs liest jetzt automatisch
#   RENDER_EXTERNAL_URL (von Render fuer jeden Web-Dienst automatisch gesetzt, render.com/docs/environment-variables,
#   19.11.2026 geprueft) -- BASE_URL bleibt im Code nur noch Rueckfall fuer Fremd-Hosting oder eine spaeter eigene
#   Domain, wird dann ueber den Einrichtungsassistenten/die Admin-Verwaltung gesetzt, nicht mehr im Blueprint-Formular.
# RESEND_API_KEY/MAIL_FROM nach ChatGPT-Pruefung Nr 289 ergaenzt (P1: "Resend-Schluessel getrennt erfassen",
# nicht nur Stripe+Bunny) -- beide OPTIONAL (konfig.mjs: ohne RESEND_API_KEY startet die App trotzdem,
# nur Mailversand ist aus; MAIL_FROM ist generisch pro Kunde/Domain, nicht an Edmunds Domain gebunden,
# im Code bestaetigt -- kein hartcodierter Domainname gefunden).
# WIEDERGABE_GEHEIMNIS NACHGETRAGEN (18.11.2026, durch echten Testklick gefunden): docs/UMGEBUNG.md Zeile 60
# nennt sie als Pflichtvariable in Produktion ("Mindestens NODE_ENV, BASE_URL, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, WIEDERGABE_GEHEIMNIS und DB_DATEI"), war aber nicht in render.yaml -- der echte
# Deploy-Versuch brach deshalb beim Start ab ("WIEDERGABE_GEHEIMNIS fehlt oder ist zu kurz"). generateValue
# wie EINSTELLUNGEN_SCHLUESSEL, da der Kunde diesen Wert nie selbst braucht/sehen soll (konfig.mjs: "Nie in
# Dateien oder im Chat speichern oder anzeigen").
#
# F-319-NACHTRAG (19.11.2026): Stripe/Bunny/Resend-Schluessel stehen hier bewusst NICHT mehr als Blueprint-
# Felder. Grund (selbst lokal nachgestellt): konfig.mjs startet den geschuetzten Web-Einrichtungsweg
# (/einrichtung, Einmal-Code, erststart.mjs) nur, wenn EINRICHTUNGSMODUS=1 UND beide Stripe-Variablen fehlen.
# Mit Stripe-Schluesseln schon im Blueprint-Formular startet die Kopie direkt im Normalmodus, in dem es
# /einrichtung gar nicht gibt und die Admin-Anmeldung mangels Admin fail-closed gesperrt ist -- der Kunde
# haette dann nur noch die Render-Shell als Weg zum ersten Admin. EINRICHTUNGSMODUS=1 ist ein FESTER Wert
# (kein sync:false): der schaltet den Setup-Modus nur frei, solange noch kein Admin existiert; sobald der
# im Browser gebaute Einrichtungsassistent durchlaufen ist, steht instanz_zustand auf 'AKTIV' (server.mjs
# Zeile 249) und der Normalmodus greift unabhaengig von dieser Variable (konfig.mjs: nur 'UNINITIALISIERT'
# bzw. 'ADMIN_ERSTELLT' lesen EINRICHTUNGSMODUS ueberhaupt). Stripe/Bunny/Resend traegt der Kunde danach im
# Admin-Bereich (Einrichtungsassistent, assistent-routen.mjs Schritt 4+) selbst ein.
services:
  - type: web
    runtime: node
    name: meine-marke
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.mjs
    autoDeployTrigger: 'off'
    disk:
      name: daten
      mountPath: /opt/render/project/daten
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DATEI
        value: /opt/render/project/daten/lern-app.db
      - key: DATEI_ORDNER
        value: /opt/render/project/daten/dateien
      - key: EINSTELLUNGEN_SCHLUESSEL
        generateValue: true
      - key: WIEDERGABE_GEHEIMNIS
        generateValue: true
      - key: EINRICHTUNGSMODUS
        value: '1'
      - key: ADMIN_ERLAUBT
        sync: false
